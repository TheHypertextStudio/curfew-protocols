name: Publish GitHub Package

on:
  push:
    tags:
      - "v0.0.*"

permissions:
  contents: read
  packages: write

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Verify generated artifacts are committed
        run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm typecheck:consumer
      - run: pnpm test

  verify-swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test

  verify-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew :generated:kotlin:test --no-daemon

  publish-npm:
    needs: [verify-typescript, verify-swift, verify-kotlin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}"
      - run: pnpm publish --access restricted --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-kotlin:
    needs: [verify-typescript, verify-swift, verify-kotlin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify release tag matches package version
        run: |
          test "v$(sed -n 's/.*\"version\": \"\([^\"]*\)\".*/\1/p' package.json)" = "${{ github.ref_name }}"
      - name: Publish Kotlin Maven package
        run: ./gradlew :generated:kotlin:publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
