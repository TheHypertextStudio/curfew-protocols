name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript (codegen, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Codegen is committed (no diff after regen)
        run: |
          pnpm codegen
          if ! git diff --quiet --exit-code; then
            echo "::error::Committed generated/ outputs are out of sync with schemas/. Run 'pnpm codegen' locally and commit."
            git diff
            exit 1
          fi
      - run: pnpm typecheck
      # Compiles the emitted .d.ts itself; `pnpm typecheck` runs with
      # skipLibCheck and would not see a duplicate identifier in the bundle.
      - run: pnpm typecheck:consumer
      - run: pnpm test

  swift:
    name: Swift (SPM build + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift --version
      - run: swift build
      - run: swift test

  kotlin:
    name: Kotlin/JVM (generated artifact + golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew :generated:kotlin:test --no-daemon

  windows-dotnet:
    name: Windows protocol decoder (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project tests/dotnet/CurfewProtocols.Decoder.csproj
