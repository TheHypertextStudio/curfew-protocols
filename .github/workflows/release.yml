name: Release protocol artifacts

on:
  release:
    types: [published]

concurrency:
  group: protocol-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Verify generated artifacts are committed
        run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm typecheck:consumer
      - run: pnpm test

  verify-swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - run: swift build
      - run: swift test

  verify-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew :generated:kotlin:test --no-daemon

  publish:
    needs: [verify-typescript, verify-swift, verify-kotlin]
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - name: Publish npm package with provenance
        run: npm publish --access public
      - name: Publish Kotlin Maven package
        run: ./gradlew :generated:kotlin:publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
