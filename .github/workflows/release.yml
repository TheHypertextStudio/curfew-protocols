name: Release protocol artifacts

on:
  workflow_dispatch:

concurrency:
  group: protocol-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Verify generated artifacts are committed
        run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm typecheck:consumer
      - run: pnpm test

  verify-swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - run: swift build
      - run: swift test

  verify-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew :generated:kotlin:test --no-daemon
